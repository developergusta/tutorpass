# Produção no VPS (Hostinger KVM) — ver docs/05-deploy-vps.md.
# Uso: cp .env.production.example .env.production (preencher os segredos)
#      docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Só o Caddy publica portas (80/443). Postgres, Redis, API e web vivem na
# rede interna do compose — nada de banco exposto na internet.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutorpass
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}"
      POSTGRES_DB: tutorpass
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env.production}"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  api:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    environment:
      NODE_ENV: production
      PORT: "3333"
      DATABASE_URL: "postgresql://tutorpass:${POSTGRES_PASSWORD}@postgres:5432/tutorpass?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env.production}"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL_DAYS: "30"
      QR_TOKEN_SECRET: "${QR_TOKEN_SECRET:?defina QR_TOKEN_SECRET no .env.production}"
      QR_WINDOW_SECONDS: "30"
      CORS_ORIGINS: "${PUBLIC_ORIGIN:?defina PUBLIC_ORIGIN no .env.production}"
      # Alerta da portaria via ntfy (rede interna; o token é o do usuário
      # publicador "api", criado no servidor — ver docs/05-deploy-vps.md).
      NTFY_BASE_URL: "http://ntfy:80"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${PUBLIC_ORIGIN:?defina PUBLIC_ORIGIN no .env.production}"
    environment:
      NODE_ENV: production
      # Next standalone escuta no hostname do container sem isto — o
      # healthcheck em 127.0.0.1:3000 nunca passaria
      HOSTNAME: "0.0.0.0"
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?defina SITE_ADDRESS no .env.production}"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped

  # --- Kit essencial (17/11/2026): monitoramento, backup, analytics, push e logs.
  # Desenho de exposição (sem domínio por enquanto):
  # - uptime-kuma e umami têm login próprio → porta direta (3001/3002).
  # - ntfy → porta direta (2586) com autenticação ligada (deny-all por padrão);
  #   tópicos são o canal de alerta do dono e, no produto, da portaria.
  # - dozzle NÃO tem porta: só o Caddy alcança, em /dozzle atrás de basic_auth
  #   (ele enxerga TODOS os logs — nunca expor direto).
  # - db-backup é interno, sem porta.
  uptime-kuma:
    # Tag "2": a linha 1.x (tag "1"/"latest") foi descontinuada e o próprio
    # Kuma avisa que não recebe mais correções — usar a tag recomendada.
    image: louislam/uptime-kuma:2
    volumes: [kuma_data:/app/data]
    ports: ["3001:3001"]
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: "postgresql://tutorpass:${POSTGRES_PASSWORD}@postgres:5432/umami"
      APP_SECRET: "${UMAMI_APP_SECRET:?defina UMAMI_APP_SECRET no .env.production}"
    ports: ["3002:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    environment:
      NTFY_BASE_URL: "${PUBLIC_ORIGIN}:2586"
      # iOS: o app recebe via APNs da ntfy.sh — o upstream encaminha o push
      # p/ servidores self-hosted (o conteúdo continua no nosso servidor).
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    volumes:
      - ntfy_data:/var/lib/ntfy
      - ntfy_cache:/var/cache/ntfy
    ports: ["2586:80"]
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_BASE: /dozzle
      DOZZLE_NO_ANALYTICS: "true"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: tutorpass
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}"
      POSTGRES_DB: tutorpass
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    # A imagem atual (v0.0.11, Go) grava em /backups (daily/weekly/monthly) —
    # o volume precisa montar aí, não no caminho antigo /db/data/backups.
    volumes: [db_backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {}, kuma_data: {}, ntfy_data: {}, ntfy_cache: {}, db_backups: {} }
